[project]
name = "orca-assistant"
version = "0.1.0"
description = "Typed spec -> validated ORCA input files (MVP; LLM layer comes later)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
orca-assistant = "orca_assistant.cli:main"
orca-parse = "orca_assistant.cli:parse_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
